name: CI

# Verification only. Deployment is handled by Cloudflare Workers Builds, which
# is connected to this repository and deploys `main` on every push using a
# credential Cloudflare holds itself. There is deliberately no deploy job here:
# two pipelines able to publish the same Worker would only race each other.
#
# Run `npm run deploy` for a manual deploy, or push to `main` for an automatic one.

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # worker-configuration.d.ts is committed, but regenerating it here catches
      # a wrangler.jsonc change that was not followed by `npm run cf-typegen`.
      - name: Generate Cloudflare binding types
        run: npm run cf-typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GITLEAKS_VERSION: 8.30.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks git . --redact --exit-code 1
