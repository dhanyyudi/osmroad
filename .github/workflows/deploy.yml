name: Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare binding types
        run: npm run cf-typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Cloudflare deploys are optional. Without CLOUDFLARE_API_TOKEN the deploy job
  # is skipped rather than failed, so a fork or a fresh clone does not show a
  # permanent red X — deploying by hand with `npm run deploy` is fully supported.
  preflight:
    name: Check deploy credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN is not set. Deploy with 'npm run deploy', or add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to enable automatic deploys."
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: [verify, preflight]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare binding types
        run: npm run cf-typegen

      - name: Build
        run: npm run build

      # The Worker and its static assets (./dist) deploy together. Secrets already
      # set on the Worker (AI_API_KEY) are preserved by `wrangler deploy`.
      #
      # Sample extracts and the DuckDB wasm live in R2 and are NOT part of this
      # job — re-upload them with `npm run assets:upload` after changing
      # anything in ./samples.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
